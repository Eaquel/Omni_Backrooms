[versions]
agp                          = "9.2.0"
kotlin                       = "2.3.21"
ksp                          = "2.3.8"
hilt                         = "2.57.1"
hiltNavigationCompose        = "1.3.0"
coreKtx                      = "1.18.0"
splashscreen                 = "1.2.0"
lifecycleRuntimeKtx          = "2.10.0"
activityCompose              = "1.13.0"
composeBom                   = "2026.05.00"
navigationCompose            = "2.9.8"
room                         = "2.8.4"
coroutines                   = "1.11.0"
datastore                    = "1.2.1"
billing                      = "9.0.0"
firebaseBom                  = "34.13.0"
googleServices               = "4.4.4"
crashlyticsPlugin            = "3.0.7"
credentialManager            = "1.5.0"
googleIdCredential           = "1.1.1"
media3                       = "1.6.1"

[libraries]
androidx-core-ktx                        = { group = "androidx.core",       name = "core-ktx",                  version.ref = "coreKtx" }
androidx-core-splashscreen               = { group = "androidx.core",       name = "core-splashscreen",         version.ref = "splashscreen" }
androidx-lifecycle-runtime-ktx           = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",     version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose     = { group = "androidx.lifecycle",  name = "lifecycle-viewmodel-compose",version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose       = { group = "androidx.lifecycle",  name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose                = { group = "androidx.activity",   name = "activity-compose",          version.ref = "activityCompose" }
androidx-compose-bom                     = { group = "androidx.compose",    name = "compose-bom",               version.ref = "composeBom" }
androidx-ui                              = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics                     = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview              = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-tooling                      = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-material3                       = { group = "androidx.compose.material3",  name = "material3" }
androidx-material-icons-extended         = { group = "androidx.compose.material",   name = "material-icons-extended" }
androidx-navigation-compose              = { group = "androidx.navigation",  name = "navigation-compose",        version.ref = "navigationCompose" }
androidx-room-runtime                    = { group = "androidx.room",        name = "room-runtime",              version.ref = "room" }
androidx-room-ktx                        = { group = "androidx.room",        name = "room-ktx",                  version.ref = "room" }
androidx-room-compiler                   = { group = "androidx.room",        name = "room-compiler",             version.ref = "room" }
kotlinx-coroutines-android               = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core                  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version.ref = "coroutines" }
androidx-datastore-preferences           = { group = "androidx.datastore",   name = "datastore-preferences",     version.ref = "datastore" }
androidx-billing                         = { group = "com.android.billingclient", name = "billing-ktx",          version.ref = "billing" }
firebase-bom                             = { group = "com.google.firebase",  name = "firebase-bom",              version.ref = "firebaseBom" }
firebase-auth                            = { group = "com.google.firebase",  name = "firebase-auth" }
firebase-firestore                       = { group = "com.google.firebase",  name = "firebase-firestore" }
firebase-crashlytics                     = { group = "com.google.firebase",  name = "firebase-crashlytics" }
firebase-crashlytics-ndk                 = { group = "com.google.firebase",  name = "firebase-crashlytics-ndk" }
firebase-messaging                       = { group = "com.google.firebase",  name = "firebase-messaging" }
firebase-analytics                       = { group = "com.google.firebase",  name = "firebase-analytics" }
firebase-config                          = { group = "com.google.firebase",  name = "firebase-config" }
androidx-credentials                     = { group = "androidx.credentials", name = "credentials",                      version.ref = "credentialManager" }
androidx-credentials-play                = { group = "androidx.credentials", name = "credentials-play-services-auth",   version.ref = "credentialManager" }
google-id-credential                     = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleIdCredential" }
androidx-media3-exoplayer                = { group = "androidx.media3",      name = "media3-exoplayer",          version.ref = "media3" }
androidx-media3-ui                       = { group = "androidx.media3",      name = "media3-ui",                 version.ref = "media3" }
hilt-android                             = { group = "com.google.dagger",    name = "hilt-android",              version.ref = "hilt" }
hilt-compiler                            = { group = "com.google.dagger",    name = "hilt-android-compiler",     version.ref = "hilt" }
hilt-navigation-compose                  = { group = "androidx.hilt",        name = "hilt-navigation-compose",   version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler                   = { group = "androidx.hilt",        name = "hilt-compiler",             version.ref = "hiltNavigationCompose" }

[plugins]
android-application                      = { id = "com.android.application",              version.ref = "agp" }
kotlin-compose                           = { id = "org.jetbrains.kotlin.plugin.compose",  version.ref = "kotlin" }
kotlin-serialization                     = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                                      = { id = "com.google.devtools.ksp",              version.ref = "ksp" }
hilt                                     = { id = "com.google.dagger.hilt.android",       version.ref = "hilt" }
google-services                          = { id = "com.google.gms.google-services",       version.ref = "googleServices" }
firebase-crashlytics                     = { id = "com.google.firebase.crashlytics",      version.ref = "crashlyticsPlugin" }
