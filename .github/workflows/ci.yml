name: Omni Backrooms CI

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NDK_VERSION:  "29.0.14206865"
  CMAKE_VERSION: "4.3.2"
  GRADLE_VERSION: "9.5.0"
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.configureondemand=true
    -Xmx6g

jobs:

  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: android-actions/setup-android@v4

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.GRADLE_VERSION }}-${{ hashFiles('**/*.toml', '**/*.gradle.kts', '**/*.kt') }}
          restore-keys: gradle-${{ runner.os }}-${{ env.GRADLE_VERSION }}-

      - name: Install NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"

      - name: Install CMake
        run: |
          CMAKE_DIR="$ANDROID_SDK_ROOT/cmake/${{ env.CMAKE_VERSION }}"
          mkdir -p "$CMAKE_DIR"
          curl -fsSL \
            "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-x86_64.tar.gz" \
            | tar -xz --strip-components=1 -C "$CMAKE_DIR"
          cat > "$CMAKE_DIR/package.xml" << 'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <ns2:repository
            xmlns:ns2="http://schemas.android.com/repository/android/common/02"
            xmlns:ns3="http://schemas.android.com/repository/android/generic/02">
            <localPackage path="cmake;${{ env.CMAKE_VERSION }}" obsolete="false">
              <type-details xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                            xsi:type="ns3:genericDetailsType"/>
              <revision><major>4</major><minor>3</minor><micro>2</micro></revision>
              <display-name>CMake ${{ env.CMAKE_VERSION }}</display-name>
            </localPackage>
          </ns2:repository>
          XML
          echo "SDK_CMAKE_DIR=$CMAKE_DIR" >> "$GITHUB_ENV"
          "$CMAKE_DIR/bin/cmake" --version

      - name: Generate gradlew + gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=false
          kotlin.code.style=official
          kotlin.incremental=true
          com.google.firebase.crashlytics.nativeSymbolUploadEnabled=true
          EOF

          # gradle-wrapper.jar'i resmi Gradle dagitim ZIP'inden cek
          mkdir -p Gradle
          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip" \
            -o /tmp/gradle-bin.zip
          unzip -jo /tmp/gradle-bin.zip \
            "gradle-${{ env.GRADLE_VERSION }}/lib/plugins/gradle-wrapper-*.jar" \
            -d /tmp/gradle-wrapper-extracted
          cp /tmp/gradle-wrapper-extracted/gradle-wrapper-*.jar Gradle/gradle-wrapper.jar
          rm -rf /tmp/gradle-bin.zip /tmp/gradle-wrapper-extracted

          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_NAME="Gradle"
          APP_BASE_NAME=$(basename "$0")
          APP_HOME=$(dirname "$(readlink -f "$0")" 2>/dev/null || cd "$(dirname "$0")" && pwd)
          CLASSPATH=$APP_HOME/Gradle/gradle-wrapper.jar
          exec java $JAVA_OPTS -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > Backrooms/google-services.json

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > Eaquel.Keystore.jks
          {
            echo "storeFile=Eaquel.Keystore.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Clean
        run: ./gradlew clean --refresh-dependencies

      - name: Build Release APK + AAB
        run: |
          ./gradlew \
            :Backrooms:assembleRelease \
            :Backrooms:bundleRelease

      - name: Verify libil2cpp.so
        run: |
          find Backrooms/build -name "libil2cpp.so" | while read f; do
            echo "Found: $f  ($(du -sh "$f" | cut -f1))"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          retention-days: 90
          path: |
            Backrooms/build/outputs/apk/release/*.apk
            Backrooms/build/outputs/bundle/release/*.aab

      - name: Upload Crashlytics NDK Symbols
        run: ./gradlew :Backrooms:uploadCrashlyticsSymbolFileRelease || true


  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ env.GRADLE_VERSION }}-${{ hashFiles('**/*.toml', '**/*.gradle.kts', '**/*.kt') }}
          restore-keys: gradle-${{ runner.os }}-${{ env.GRADLE_VERSION }}-

      - name: Generate gradlew + gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=false
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=false
          kotlin.code.style=official
          kotlin.incremental=true
          com.google.firebase.crashlytics.nativeSymbolUploadEnabled=true
          EOF

          # gradle-wrapper.jar'i resmi Gradle dagitim ZIP'inden cek
          mkdir -p Gradle
          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${{ env.GRADLE_VERSION }}-bin.zip" \
            -o /tmp/gradle-bin.zip
          unzip -jo /tmp/gradle-bin.zip \
            "gradle-${{ env.GRADLE_VERSION }}/lib/plugins/gradle-wrapper-*.jar" \
            -d /tmp/gradle-wrapper-extracted
          cp /tmp/gradle-wrapper-extracted/gradle-wrapper-*.jar Gradle/gradle-wrapper.jar
          rm -rf /tmp/gradle-bin.zip /tmp/gradle-wrapper-extracted

          cat > gradlew << 'GRADLEW'
          #!/bin/sh
          APP_NAME="Gradle"
          APP_BASE_NAME=$(basename "$0")
          APP_HOME=$(dirname "$(readlink -f "$0")" 2>/dev/null || cd "$(dirname "$0")" && pwd)
          CLASSPATH=$APP_HOME/Gradle/gradle-wrapper.jar
          exec java $JAVA_OPTS -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
          GRADLEW
          chmod +x gradlew

          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Lint + Detekt
        run: ./gradlew :Backrooms:detekt || true

      - name: Android Lint
        run: ./gradlew :Backrooms:lintRelease || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          retention-days: 14
          path: |
            Backrooms/build/reports/lint-results-release.html
            Backrooms/build/reports/detekt/
