name: Omni Backrooms CI

on:
  # Every branch, not just main. Pushing work somewhere and getting nothing back
  # until it is merged defeats the point — and with the build gated to main,
  # a branch push produced no run at all, so there was never anything to
  # download from it.
  push:
    branches: [ '**' ]
    tags-ignore: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NDK_VERSION:  "29.0.14206865"
  CMAKE_VERSION: "4.3.2"
  GRADLE_VERSION: "9.5.1"

jobs:

  # Cheap checks that need neither the Android SDK nor the NDK, so they report
  # in a minute or two instead of waiting on a full release build. Both cover
  # things the Gradle build genuinely cannot see: GLSL lives inside Kotlin raw
  # strings, and the level generator is an infinite pure function with no
  # authored data to inspect.
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install glslang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools

      # Every check below guards something the Gradle build genuinely cannot
      # see. GLSL lives inside Kotlin raw strings; the level generator is an
      # infinite pure function with no authored data to inspect; icons are
      # hand-written vector XML that aapt2 accepts even when malformed; and the
      # JNI contract between Kotlin and C++ is resolved by name at runtime, so
      # nothing at build time notices when the two sides disagree.

      # A shader that fails to compile throws on the GL thread the first time
      # its screen is opened, and the only symptom is a black screen.
      - name: Shaders
        run: python3 Tools/Shaders_Check.py

      # Drawables, mesher UVs, the inspection camera envelope, the cosmetic
      # catalogue, asset duplication, Title Case, locale completeness, the Unity
      # disguise's internal consistency, and the ten READMEs staying one
      # document.
      - name: Assets
        run: python3 Tools/Assets_Check.py

      # JNI symbols against Kotlin's external fun declarations, the CMake
      # source list, and a warnings-as-errors host build of the modules that
      # do not need the NDK.
      - name: Native
        run: python3 Tools/Native_Check.py

      # Floods the map from the spawn and proves the exit is actually reachable,
      # over many seeds. An unreachable exit is unwinnable and silent.
      - name: Level 0
        run: python3 Tools/Level_0_Check.py 40

      # Spawn tuning, the entity model and the entity JNI surface.
      - name: Entities
        run: python3 Tools/Entity_Check.py

      # Every sound is synthesised on device, so there is no waveform to
      # eyeball. This asserts the generators are finite, deterministic, free of
      # DC offset and not clipping.
      - name: Sound
        run: python3 Tools/Code_To_Sound.py

  # Runs on every branch and every pull request, not just main.
  #
  # It used to be gated to main and release/*, which meant a feature branch got
  # a green tick and no build to install — the run was there, the job said
  # "skipped", and the Artifacts section was simply absent. The whole point of
  # CI on a branch is being able to put the thing on a phone before merging it.
  build-release:
    # Waits for static-checks rather than racing it.
    #
    # This account gets one runner at a time. Started in parallel, build-release
    # claimed it and static-checks sat in the queue with runner_id 0 and not a
    # single step recorded until its own 15-minute timeout cancelled it. Three
    # runs in a row reported failure that way while the APK built perfectly —
    # the checks had not found anything, they had never run.
    #
    # Sequencing also puts them in the right order: the two-minute job that can
    # say "this shader will not compile" should answer before the fifty-minute
    # one that links the whole app.
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version ${{ env.GRADLE_VERSION }}

      - name: Install NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}"

      - name: Install CMake
        run: |
          CMAKE_DIR="$ANDROID_SDK_ROOT/cmake/${{ env.CMAKE_VERSION }}"
          mkdir -p "$CMAKE_DIR"
          curl -fsSL \
            "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-x86_64.tar.gz" \
            | tar -xz --strip-components=1 -C "$CMAKE_DIR"
          cat > "$CMAKE_DIR/package.xml" << 'XML'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <ns2:repository
            xmlns:ns2="http://schemas.android.com/repository/android/common/02"
            xmlns:ns3="http://schemas.android.com/repository/android/generic/02">
            <localPackage path="cmake;${{ env.CMAKE_VERSION }}" obsolete="false">
              <type-details xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                            xsi:type="ns3:genericDetailsType"/>
              <revision><major>4</major><minor>3</minor><micro>2</micro></revision>
              <display-name>CMake ${{ env.CMAKE_VERSION }}</display-name>
            </localPackage>
          </ns2:repository>
          XML
          echo "SDK_CMAKE_DIR=$CMAKE_DIR" >> "$GITHUB_ENV"
          "$CMAKE_DIR/bin/cmake" --version

      - name: Setup gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:+UseG1GC
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.daemon=true
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          android.enableJetifier=false
          kotlin.code.style=official
          kotlin.incremental=true
          com.google.firebase.crashlytics.nativeSymbolUploadEnabled=true
          EOF

      # Secrets are not readable from a fork's pull request. Rather than fail
      # there, fall back so the run still produces something installable — a
      # build you cannot download is no more useful than no build at all.
      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > Backrooms/google-services.json
            echo "Using the real Firebase configuration."
          else
            # The Google Services plugin refuses to configure without this file.
            # A well-formed placeholder lets the build proceed; Firebase is
            # simply inert against it.
            echo "::notice::No GOOGLE_SERVICES_JSON secret; using a placeholder. Firebase will be inert in this build."
            cat > Backrooms/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "omni-backrooms-placeholder",
              "storage_bucket": "omni-backrooms-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "com.omni.backrooms" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "AIzaSyPlaceholderPlaceholderPlaceholder0" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signing keystore available; building a debug-signed APK so the run is still installable."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > Eaquel.Keystore.jks
          {
            echo "storeFile=Eaquel.Keystore.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Clean
        run: ./gradlew clean

      - name: Build
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew :Backrooms:assembleRelease :Backrooms:bundleRelease
          else
            # An unsigned release APK will not install on a device, so without a
            # keystore the debug variant is the useful thing to hand back.
            ./gradlew :Backrooms:assembleDebug
          fi

      # Both halves of the Unity costume have to be in the packaged libraries.
      # libil2cpp.so on its own is a file with a suggestive name; the pair is
      # what a Unity APK actually looks like, and a missing libunity.so is the
      # kind of silent regression a CMake edit causes without failing anything.
      - name: Verify the native libraries
        run: |
          missing=0
          for lib in libil2cpp.so libunity.so; do
            found="$(find Backrooms/build -name "$lib" | head -1)"
            if [ -z "$found" ]; then
              echo "::error::$lib was not built"
              missing=1
            else
              echo "Found: $found  ($(du -h "$found" | cut -f1))"
            fi
          done
          exit "$missing"

      # Names the branch and the commit, so several runs' downloads stay apart
      # in the Artifacts list instead of all reading "release-build".
      - name: Name the artifact
        id: naming
        run: |
          SAFE_REF="$(echo "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd '[:alnum:]._-')"
          echo "name=omni-backrooms-${SAFE_REF}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.name }}
          retention-days: 90
          # Fail loudly on a path that matches nothing. The default is a warning,
          # which is how a run can go green while quietly uploading no APK at
          # all — the failure mode looks identical to a skipped job.
          if-no-files-found: error
          path: |
            Backrooms/build/outputs/apk/**/*.apk
            Backrooms/build/outputs/bundle/**/*.aab

      # Puts the download and its checksums on the run's summary page, so the
      # build is one click from the run rather than something to go hunting for.
      - name: Summarise the build
        if: always()
        run: |
          {
            echo "## Download"
            echo
            echo "Artifact: **${{ steps.naming.outputs.name }}** — on this run's page, under *Artifacts*."
            if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
              echo "Signed with the release key."
            else
              echo "Debug-signed (no release keystore available on this run)."
            fi
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---:|---|"
            find Backrooms/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) | sort | while read -r f; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -c1-16)…\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs after the artifact upload on purpose: whatever happens here, the
      # build is already downloadable.
      #
      # This used to be one line ending in `|| true`, and it had been failing on
      # every signed release since the day it was added — "task
      # 'uploadCrashlyticsSymbolFileRelease' not found in project ':Backrooms'",
      # BUILD FAILED in 1s, swallowed, green tick. A step that cannot fail
      # cannot tell you it is broken, which is the whole reason nobody noticed
      # that a native game was shipping without native crash symbols.
      #
      # So the two failure modes are now separated. A missing task is a build
      # configuration bug in this repository and fails the run; a failed upload
      # is Firebase's end and only warns.
      - name: Upload Crashlytics NDK symbols
        if: steps.keystore.outputs.signed == 'true'
        run: |
          if ! ./gradlew -q :Backrooms:tasks --all 2>/dev/null \
               | grep -q 'uploadCrashlyticsSymbolFileRelease'; then
            echo "::error::uploadCrashlyticsSymbolFileRelease does not exist. Native symbol upload is not enabled for the release variant, so native crashes will arrive in Crashlytics unsymbolicated."
            exit 1
          fi
          ./gradlew :Backrooms:uploadCrashlyticsSymbolFileRelease \
            || echo "::warning::The symbol upload task ran but did not succeed; this build's native symbols may be missing from Crashlytics."
